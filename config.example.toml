# Example Jarvis configuration: every setting at its shipped default.
# Copy it to ~/.config/jarvis/config.toml and change what you need; a key you leave out keeps its
# default. docs/configuration.md explains each one. Keep your own copy out of the repository.

schema_version = 1
# data_dir: default $XDG_DATA_HOME/jarvis (~/.local/share/jarvis); give an absolute path to change it.

# How Jarvis talks to its model, the local Strata server. Empty base_url: Strata's own port.
[model]
base_url = ""
model = "jarvis"
request_timeout_s = 120.0
temperature = 0.2

# How much one spoken request may do, and how much of the talk Jarvis remembers. reply_tokens caps
# each answer the model writes; memory_tokens is the room the conversation may take of the model's
# context (older turns are summarized to stay within it); memory_idle_s forgets it after that long
# without a request (0: never). thinking is how hard the model thinks at the start of each request;
# it may raise that itself for the rest of a request, up to thinking_max (set it equal to thinking
# to never raise). After a raise it thinks up to thinking_raised_tokens per call ([chat] too).
[agent]
max_steps = 8
max_tool_calls = 12
max_seconds = 90.0
reply_tokens = 400
tool_text_chars = 3000
memory_tokens = 6000
memory_idle_s = 1800.0
thinking = "none"
thinking_tokens = 192
thinking_max = "high"
thinking_raised_tokens = 768

# The same for typed requests in `jarvis chat`, with room for longer written work. resume opens the
# chat on its last conversation (/clear starts a new one).
[chat]
max_steps = 30
max_tool_calls = 40
max_seconds = 600.0
reply_tokens = 2048
tool_text_chars = 8000
memory_tokens = 7000
memory_idle_s = 0.0
thinking = "none"
thinking_tokens = 512
thinking_max = "high"
thinking_raised_tokens = 1024
resume = true
verbosity = "replies"
toolbar = true
history_size = 1000

# How the jarvis-strata service runs the model; `jarvis setup` writes these into its profile.
# The model, its engine and its flags come from Strata's own run config: run `strata launch` for
# the model once, then point run_config at the strata-<model>.json it writes.
[strata]
# home: default $XDG_DATA_HOME/strata; an absolute path.
# components_parent: default $XDG_DATA_HOME; an absolute path.
# run_config = "/path/to/strata/install/strata-<model>.json"
port = 8080
context = 24576
expert_vram_gib = 1.0  # experts kept in VRAM, for an engine that takes a size; the rest in RAM
idle_unload_s = 86400
reasoning_budget_tokens = 512
keep_in_ram = true  # keep the model server's memory out of swap and lockable
speed_projection = true  # keep a control vector the run config loads (docs/configuration.md)
effort_position = ""  # where Strata writes a raised effort; "": the run config's own
memory_max = "40G"  # MemoryHigh of the Strata unit; MemoryMax is 10% above it
# vram_reserve_mib = 700  # VRAM left free for other programs (100 to 65536); unset: Strata's own default
kv_resident = 0  # context cells kept in VRAM (20480 or more), the whole context in RAM; 0: all in VRAM
pictures = true  # use the picture reader the run config names; false: no pictures
vision_idle_s = 120

# Your own Spotify developer app (docs/configuration.md): paste its client ID, or run
# `jarvis setup --spotify-client-id <id>`.
[spotify]
client_id = ""
redirect_port = 8765
device_name = ""
close_match = 0.8
loose_match = 0.6
queue_max = 20
search_pages = 8
library_refresh_s = 21600.0

# Microphone, wake word, speech to text and voice. Empty source: the default microphone.
[audio]
source = ""
wake_words = ["hey_jarvis", "yo_jarvis"]
wake_threshold = 0.5
vad_threshold = 0.5
vad_neg_threshold = 0.0
no_speech_timeout_s = 4.0
end_silence_s = 0.7
max_utterance_s = 20.0
confirm_window_s = 8.0
confirm_key_s = 30.0
barge_in = true
listen_when_locked = true
follow_up_s = 6.0
follow_up_over_audio = false
wake_engine = "livekit"
azure_keyword_model = ""
azure_python = ""
voice = "kokoro:bm_george"
speech_speed = 1.0
kokoro_phoneme_map = false
transcribe_engine = ""
transcribe_model = "small.en"
transcribe_threads = 8
transcribe_backend = ""
transcribe_short_window = true
vocabulary_hint = true
hint_names = 40
listen_to_pc = false
pc_audio_apps = ["discord"]
pc_audio_grant_s = 600.0
confirm_blocks_on_pc_speech = true
pc_audio_cooldown_s = 5.0

# A wake word's own score needed, by model name, in place of wake_threshold (e.g. jarvis = 0.85).
[audio.wake_thresholds]

# How Jarvis sings (the sing tool): "speech" with the Kokoro voice on the CPU, "soulx" with SoulX-Singer
# on the GPU (tools/get_singer.py installs it), or "auto": soulx when installed, else speech.
[sing]
engine = "auto"
device = 0

# Who Jarvis is and how it speaks; addendum is added to the system prompt.
[persona]
name = "Jarvis"
tone = "Calm, warm and to the point, like a capable butler with a light touch of dry wit."
addendum = ""

# twelve_hour = false says "15:42" instead of "3:42 PM".
[clock]
twelve_hour = true

# How Jarvis writes numbers everywhere: "," (1,488), " ", "'" or "" for none.
[format]
thousands_separator = ","

# Your home, for weather that names no place: a place name such as "Lisbon", or
# coordinates = [38.72, -9.14] for an exact point (then no lookup is sent).
[weather]
place = ""
coordinates = []
temperature_unit = "celsius"
wind_unit = "kmh"

# The local SearXNG (deploy/searxng/) and how much of a page or thread the model reads.
[research]
searxng_url = "http://127.0.0.1:8888"
results = 5
page_chars = 2800
reddit_comments = 6

# The folders Jarvis may read and write; ~ is your home. Keys, tokens, browser profiles and
# Jarvis's own state are never read or written; deny adds more (patterns such as "diary*").
# Hidden files and folders under home are read only where hidden_allow opens them (by default
# the desktop's own settings). Writing a file asks you first (unless bypass_consent is on) and
# never touches a hidden file or folder.
[files]
read_roots = ["~"]
write_roots = ["~/Documents"]
deny = []
hidden_allow = [".config/hypr", ".config/omarchy", ".config/waybar", ".config/walker", ".config/mako", ".config/swayosd", ".config/kitty", ".config/alacritty", ".config/ghostty", ".config/foot", ".config/btop", ".config/fastfetch", ".config/jarvis"]

[boundaries]
# true: act without asking (deny still refuses); false: ask for a yes first. `jarvis consent ask|bypass`.
bypass_consent = true
# The most side-effecting actions in any actions_window_s seconds, voice and chat together, in both modes.
max_actions = 30
actions_window_s = 600.0

# Per-operation classes: "safe", "confirm", "strong" or "deny". For example:
# reddit_search = "deny"
[boundaries.classes]
