# The local SearXNG Jarvis searches through (docs/configuration.md, [research]).
# Reachable only on this machine; its secret comes from `.env` beside this file (never committed):
#   printf 'SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" > deploy/searxng/.env
#   docker compose -f deploy/searxng/compose.yaml up -d
name: jarvis-searxng
services:
  searxng:
    image: docker.io/searxng/searxng:2026.11.6-ac11e14c5@sha256:c750ee1d859b26d3aeae51c07f6a48c3a0bfbaa9195d71a18b258862d88c4c3c
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in deploy/searxng/.env}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    # SearXNG's engine caches live in /tmp: kept in memory, gone when the container stops.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
