[project]
name = "jarvis"
version = "0.1.0"
description = "Local always-on voice agent for Omarchy: wake word, Voxtype dictation, a Strata model and Spotify control."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["voice-assistant", "wake-word", "speech", "spotify", "local-llm", "omarchy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "httpx==0.28.1",
    "livekit-wakeword==2.1.3",
    "numpy==2.5.5",
    "onnxruntime==1.32.0",
    "piper-tts==1.8.0",
    "pydantic==2.12.5",
    "textual==8.2.8",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.412",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
timeout = 30
markers = [
    "local: needs this PC's hardware or services (Strata, Voxtype, audio, Spotify); never runs in CI",
]
