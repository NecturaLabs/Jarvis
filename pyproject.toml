[project]
name = "jarvis"
version = "0.1.0"
description = "Local always-on voice agent for Omarchy: wake word, Voxtype dictation, a Strata model and Spotify control."
readme = "README.md"
license = "GPL-3.0-or-later AND MIT"  # the Azure wake helper alone is MIT (ADR 0010)
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "NecturaLabs" }]
requires-python = ">=3.14"
keywords = ["voice-assistant", "wake-word", "speech", "spotify", "local-llm", "omarchy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Private :: Do Not Upload",
]
dependencies = [
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "livekit-wakeword==2.1.3",
    "numpy==2.5.5",
    "onnxruntime==1.32.0",
    "pillow==13.0.0",
    "piper-tts==1.8.0",
    "pydantic==2.14.3",
    "textual==8.2.8",
    "textual-image==0.14.2",
    "tomlkit==0.15.2",
    "trafilatura==2.3.1",
]

[project.urls]
Homepage = "https://github.com/NecturaLabs/Jarvis"
Documentation = "https://github.com/NecturaLabs/Jarvis/tree/dev/docs"
Issues = "https://github.com/NecturaLabs/Jarvis/issues"
Changelog = "https://github.com/NecturaLabs/Jarvis/blob/dev/CHANGELOG.md"
Security = "https://github.com/NecturaLabs/Jarvis/security/policy"

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "reuse==6.3.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The checks in tools/ are scripts, not a package; their tests import them by name, as they do
# the shared fixtures in tests/strata_fixture.py.
pythonpath = ["tools", "tests"]
addopts = ["-ra"]
strict = true  # strict config, markers, xfail and parametrization ids
timeout = 30
# A warning is a bug found early: an unclosed pipe, a deprecated call. Fix the cause; the only
# exception is a third-party warning Jarvis cannot change, ignored here by category and module.
filterwarnings = ["error"]
markers = [
    "local: needs this PC's hardware or services (Strata, Voxtype, audio, Spotify); never runs in CI",
]
