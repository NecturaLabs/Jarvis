version: 2
updates:
  - package-ecosystem: uv
    directory: /
    labels: [dependencies, python]
    schedule:
      interval: weekly
    # A release younger than a week is not proposed, so a hijacked publish has time to be caught and
    # pulled first. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, github_actions]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
