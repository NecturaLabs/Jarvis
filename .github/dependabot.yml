version: 2
updates:
  - package-ecosystem: uv
    directory: /
    labels: [dependencies, python]
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, github_actions]
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
