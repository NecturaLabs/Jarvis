name: Documentation change
description: Correct or extend repository documentation.
labels:
- documentation
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact tokens,
      recordings and personal data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Wake word, microphone and transcription
    - Speech output and confirmation
    - Agent loop and prompts
    - Boundaries, provenance and audit log
    - Model and Strata
    - Spotify
    - PC operations
    - Web research
    - Install, setup and configuration
    - Tests
    - Documentation
    - CI, lint and supply chain
    - Not sure
  validations:
    required: true
- type: textarea
  id: location
  attributes:
    label: Location and current problem
    description: Link the affected page or file and identify missing, incorrect or outdated information.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Expected documentation
    description: Describe the correction and cite the current behaviour or source.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: List what a reader should be able to find or understand, and any links or examples to check.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
