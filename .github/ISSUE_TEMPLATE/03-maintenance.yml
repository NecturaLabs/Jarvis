name: Maintenance task
description: Track refactoring, tooling, reliability or project-process work.
labels:
- maintenance
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact tokens,
      recordings and personal data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Wake word, microphone and transcription
    - Speech output and confirmation
    - Agent loop and prompts
    - Boundaries, provenance and audit log
    - Model and Strata
    - Spotify
    - PC operations
    - Web research
    - Install, setup and configuration
    - Tests
    - Documentation
    - CI, lint and supply chain
    - Not sure
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Scope and current problem
    description: Name the affected code, tool or process and explain what needs to change.
  validations:
    required: true
- type: textarea
  id: deliverable
  attributes:
    label: Expected result
    description: Describe the concrete deliverable and its boundaries.
  validations:
    required: true
- type: textarea
  id: constraints
  attributes:
    label: Constraints and related work
    description: Link relevant files, issues or requirements. Record dependencies and decisions that remain open.
  validations:
    required: false
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: List observable outcomes that make this issue complete.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
- type: textarea
  id: where_to_see
  attributes:
    label: Where to see it (optional)
    description: Give the check or workflow that demonstrates the current problem and will verify the result, with exact commands when useful.
  validations:
    required: false
