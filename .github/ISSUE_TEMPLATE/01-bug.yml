name: Bug report
description: Report incorrect behaviour or a failure.
labels:
- bug
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact tokens,
      recordings and personal data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Wake word, microphone and transcription
    - Speech output and confirmation
    - Agent loop and prompts
    - Boundaries, provenance and audit log
    - Model and Strata
    - Spotify
    - PC operations
    - Web research
    - Install, setup and configuration
    - Tests
    - Documentation
    - CI, lint and supply chain
    - Not sure
  validations:
    required: true
- type: textarea
  id: observed
  attributes:
    label: Observed behaviour
    description: What happens, including the exact error or what Jarvis said or did.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behaviour and acceptance criteria
    description: State what should happen as checkable outcomes.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Give numbered steps. For a spoken request, write the words you said and whether you typed or spoke them. For intermittent failures, describe how often it happens and what you tried.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Include the output of `jarvis --version` and `jarvis doctor`, Omarchy version, kernel, GPU, and Strata version. Say unknown for unavailable details.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs and related work
    description: Attach redacted output from `jarvis logs` or the chat window, and links to related issues. Leave out tokens and recordings.
  validations:
    required: false
- type: textarea
  id: where_to_see
  attributes:
    label: Where to see it (optional)
    description: Give a safe way to reproduce it and the exact commands when useful. Run anything that could make a sound with `PIPEWIRE_REMOTE=/nonexistent PULSE_SERVER=unix:/nonexistent`.
  validations:
    required: false
