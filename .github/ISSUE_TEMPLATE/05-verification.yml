name: Verification task
description: Verify implemented behaviour and record actual results.
labels:
- verification
- needs-verification
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact tokens,
      recordings and personal data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Wake word, microphone and transcription
    - Speech output and confirmation
    - Agent loop and prompts
    - Boundaries, provenance and audit log
    - Model and Strata
    - Spotify
    - PC operations
    - Web research
    - Install, setup and configuration
    - Tests
    - Documentation
    - CI, lint and supply chain
    - Not sure
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Behaviour to verify
    description: Name the implemented behaviour and link its issue, pull request or commit.
  validations:
    required: true
- type: textarea
  id: procedure
  attributes:
    label: Procedure and environment
    description: Describe the hardware, services and steps needed. State any accounts or owner involvement without supplying secrets. Run audio checks silently, or say how they were kept quiet.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: Describe expected observable results. Leave checks open until evidence exists.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
- type: textarea
  id: results
  attributes:
    label: Results so far
    description: Record only checks actually run, including exact version or commit, environment, results and remaining gaps. Leave empty if not run.
  validations:
    required: false
