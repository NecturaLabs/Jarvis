# This project's ruff settings. The strict base is .lint/ruff.toml (managed; never edit it, run
# lint.py sync); this file holds only what is this project's. ruff docs: https://docs.astral.sh/ruff/
extend = ".lint/ruff.toml"
target-version = "py314"

# Paths ruff leaves alone (generated or vendored code):
# extend-exclude = ["vendor"]

[lint]
# The base ignores PT009 and PT027 for stdlib unittest scripts; this project tests with pytest.
extend-select = ["PT009", "PT027"]

[lint.isort]
known-first-party = ["jarvis"]

# `extend-per-file-ignores` adds to the base's entries (the test relaxations); a plain
# `per-file-ignores` here would replace them all.
[lint.extend-per-file-ignores]
# One entry per deliberate exception, with the reason on the line above:
# "tools/legacy.py" = ["C901"]
# The checks in tools/ are command-line scripts run by path, not a package.
"tools/*.py" = ["INP001"]
# Fixtures several test modules import by name (pytest's pythonpath), like the tests themselves.
"tests/strata_fixture.py" = ["INP001"]
# The OAuth callback test makes a real request to the in-process loopback server with the standard
# library's client (the tests keep httpx out of it); tests/conftest.py allows only loopback ports a test bound.
"tests/test_spotify_auth.py" = ["TID251"]
# These tests import a lazy module at the top because it is what they test; the other tests defer it.
"tests/test_chat.py" = ["TID253"]
"tests/test_cli.py" = ["TID253"]
"tests/test_kokoro.py" = ["TID253"]
"tests/test_sing_psola.py" = ["TID253"]

# These modules are heavy to import (Textual, ONNX models, Piper, LiveKit, an HTML extractor, Praat,
# the Azure SDK in its own helper) and most commands and the idle service never use them, so they load inside the
# function that needs them. Ruff then allows that import there without a suppression (PLC0415) and
# rejects a top-level import of them (TID253). `jarvis.audio` and `jarvis.voice` are lazy in cli.py too
# but `voice.py` and the tests import `jarvis.audio` at the top, so their deferrals carry a reason instead.
[lint.flake8-tidy-imports]
banned-module-level-imports = [
  "azure.cognitiveservices.speech",
  "jarvis.chat.app",
  "jarvis.kokoro",
  "livekit",
  "parselmouth",
  "piper",
  "trafilatura",
]

