# This project's ruff settings. The strict base is .lint/ruff.toml (managed; never edit it, run
# lint.py sync); this file holds only what is this project's. ruff docs: https://docs.astral.sh/ruff/
extend = ".lint/ruff.toml"
target-version = "py314"

# Paths ruff leaves alone (generated or vendored code):
# extend-exclude = ["vendor"]

[lint]
# The base ignores PT009 and PT027 for stdlib unittest scripts; this project tests with pytest.
extend-select = ["PT009", "PT027"]

[lint.isort]
known-first-party = ["jarvis"]

# `extend-per-file-ignores` adds to the base's entries (the test relaxations); a plain
# `per-file-ignores` here would replace them all.
[lint.extend-per-file-ignores]
# One entry per deliberate exception, with the reason on the line above:
# "tools/legacy.py" = ["C901"]
# The checks in tools/ are command-line scripts run by path, not a package, and they report on stdout.
"tools/*.py" = ["INP001", "T201"]

# Product rules from AGENTS.md, enforced by lint (tests/test_product_rules.py scans the tree for the
# rest): Jarvis is local and free, so no hosted-model SDK may be imported. Add the real module path.
[lint.flake8-tidy-imports.banned-api]
"openai".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"anthropic".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"google.generativeai".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"google.genai".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"litellm".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"cohere".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"mistralai".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"groq".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"together".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"replicate".msg = "Product rule: no hosted model backend or paid API; Jarvis talks only to the local Strata server (AGENTS.md, Product rules)."
"huggingface_hub".msg = "Product rule: no hosted model backend or paid API, and models live outside the repository where the owner puts them (AGENTS.md, Product rules)."
"os.system".msg = "Product rule: boundaries are enforced by typed operations; no shell strings. Use subprocess with an argument list in the files that may (AGENTS.md, Boundaries)."
"os.popen".msg = "Product rule: boundaries are enforced by typed operations; no shell strings. Use subprocess with an argument list in the files that may (AGENTS.md, Boundaries)."
